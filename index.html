<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Líder Supremo - Simulador de Governo</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="feedback-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Relatório de Aprovação Popular ✊</h2>
            <div id="feedback-details">
                <!-- Feedback será inserido via JS -->
            </div>
        </div>
    </div>

    <div id="laws-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" id="close-laws">&times;</span>
            <h2>Leis do País 📜</h2>
            <ul id="laws-list">
                <!-- Leis serão inseridas via JS -->
            </ul>
        </div>
    </div>

    <div id="game-container">
        <header>
            <h1>Líder Supremo: <span id="country-name" contenteditable="true">Meu País</span></h1>
            <p>Governe com mão de ferro ou coração de ouro.</p>
        </header>

        <main>
            <section id="stats-dashboard">
                <div class="stat-card" title="Saúde">
                    <span class="icon">🏥</span>
                    <div class="stat-info">
                        <label>Saúde</label>
                        <div class="progress-bar-bg"><div id="stat-health" class="progress-fill" style="width: 50%;"></div></div>
                        <span id="value-health">50%</span>
                    </div>
                </div>
                <div class="stat-card" title="Educação">
                    <span class="icon">🎓</span>
                    <div class="stat-info">
                        <label>Educação</label>
                        <div class="progress-bar-bg"><div id="stat-education" class="progress-fill" style="width: 50%;"></div></div>
                        <span id="value-education">50%</span>
                    </div>
                </div>
                <div class="stat-card" title="Segurança">
                    <span class="icon">🛡️</span>
                    <div class="stat-info">
                        <label>Segurança</label>
                        <div class="progress-bar-bg"><div id="stat-security" class="progress-fill" style="width: 50%;"></div></div>
                        <span id="value-security">50%</span>
                    </div>
                </div>
                <div class="stat-card" title="Economia">
                    <span class="icon">💰</span>
                    <div class="stat-info">
                        <label>Economia</label>
                        <div class="progress-bar-bg"><div id="stat-economy" class="progress-fill" style="width: 50%;"></div></div>
                        <span id="value-economy">50%</span>
                    </div>
                </div>
                <div class="stat-card approval" title="Aprovação Geral">
                    <span class="icon">✊</span>
                    <div class="stat-info">
                        <label>Aprovação Geral</label>
                        <div class="progress-bar-bg"><div id="stat-approval" class="progress-fill" style="width: 50%;"></div></div>
                        <span id="value-approval">50%</span>
                    </div>
                </div>
                <button id="laws-btn" class="stat-card">
                    <span class="icon">📜</span>
                    <div class="stat-info">
                        <label>Leis</label>
                        <span>Ver Decretos</span>
                    </div>
                </button>
            </section>

            <div class="middle-section">
                <section id="ai-advisor">
                    <h2>Conselheiro IA 🤖</h2>
                    <div id="ai-content">
                        <div id="chat-history">
                            <div class="message advisor-message">Olá, Líder Supremo. Como posso ajudá-lo hoje?</div>
                        </div>
                        <div id="chat-input-area">
                            <input type="text" id="chat-input" placeholder="Pergunte ou ordene algo ao conselheiro...">
                            <button id="send-chat">Enviar</button>
                        </div>
                    </div>
                </section>

            </div>

        </main>

        <footer>
            <p>&copy; 2024 Simulador de Líder Supremo - Governe com Sabedoria</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
